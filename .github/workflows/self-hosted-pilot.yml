name: Self-hosted CI pilot

# Dispatch a reviewed ref explicitly; provisioning must finish before the first run.
# No pull_request/pull_request_target trigger: fork code never runs automatically.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: smoke builds and runs unit tests; full runs the existing Linux suite
        type: choice
        options: [smoke, full]
        default: smoke

      include-tigger:
        description: Include Tigger after SSH provisioning and runner verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: self-hosted-pilot
  cancel-in-progress: false

jobs:
  linux:
    if: >-
      github.repository == 'eoniclabs/MethodCache' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/cross-platform-runners')
    uses: ./.github/workflows/run-script.yml
    with:
      command: ${{ inputs.suite == 'full' && 'build/ci/actions-linux.sh full' || 'build/ci/actions-linux.sh smoke' }}
      runner-group: ci-public-reviewed
      runner-label: linux-docker
      artifact-path: artifacts/ci/

  macos:
    if: >-
      github.repository == 'eoniclabs/MethodCache' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/cross-platform-runners')
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.include-tigger && '["megatron","tigger"]' || '["megatron"]') }}
    uses: ./.github/workflows/run-script.yml
    with:
      command: bash build/ci/jobs.sh build && bash build/ci/jobs.sh unit
      runner-group: ci-public-reviewed
      runner-label: ${{ matrix.host }}
      artifact-path: artifacts/ci/

  windows:
    if: >-
      github.repository == 'eoniclabs/MethodCache' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/cross-platform-runners')
    uses: ./.github/workflows/run-script.yml
    with:
      command: '& ./build/ci/windows.ps1 build unit'
      runner-group: ci-public-reviewed
      runner-label: windows-build
      artifact-path: artifacts/ci/
