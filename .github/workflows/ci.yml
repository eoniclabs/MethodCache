name: CI

# Runs the scripts in build/ci, the same ones the build servers run. This workflow goes away once the build
# servers post the merge-gate statuses.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the Linux jobs in the build image
        run: build/ci/linux.sh

      - name: Upload the job logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-logs
          path: artifacts/ci
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Run the Windows jobs
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/ci/windows.ps1

      - name: Upload the job logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: artifacts/ci
          if-no-files-found: ignore
