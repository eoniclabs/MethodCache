name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore MethodCache.sln

      - name: Build
        run: dotnet build MethodCache.sln --configuration Release --no-restore

      - name: Run the demo
        # Each chapter checks its own claims and the run fails if one does not hold
        run: dotnet run --project samples/MethodCache.Demo --configuration Release --no-build

      - name: Test with coverage (net8.0, net9.0 and net10.0)
        run: dotnet test MethodCache.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
        env:
          # Redis and SQL Server run in Testcontainers on this runner; a missing container fails the run instead of skipping
          METHODCACHE_REQUIRE_INFRA_TESTS: "true"

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./TestResults/**/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  unit-tests-windows:
    # Paths, line endings and the Windows runtime; the Docker-backed Redis and SQL Server tests run on Linux only
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build MethodCache.sln --configuration Release

      - name: Test
        run: dotnet test MethodCache.sln --configuration Release --no-build --filter "FullyQualifiedName!~MethodCache.Redis.IntegrationTests&FullyQualifiedName!~MethodCache.SqlServer.IntegrationTests"

  unit-tests-culture:
    # Turkish (dotted/dotless i, comma decimals) and Swedish (U+2212 minus sign, comma decimals) catch
    # formatting and parsing that depends on the current culture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Build
        run: dotnet build MethodCache.sln --configuration Release

      - name: Test with tr-TR
        run: dotnet test MethodCache.sln --configuration Release --no-build --framework net10.0 --filter "FullyQualifiedName!~MethodCache.Redis.IntegrationTests&FullyQualifiedName!~MethodCache.SqlServer.IntegrationTests"
        env:
          LANG: tr_TR.UTF-8
          LC_ALL: tr_TR.UTF-8

      - name: Test with sv-SE
        run: dotnet test MethodCache.sln --configuration Release --no-build --framework net10.0 --filter "FullyQualifiedName!~MethodCache.Redis.IntegrationTests&FullyQualifiedName!~MethodCache.SqlServer.IntegrationTests"
        env:
          LANG: sv_SE.UTF-8
          LC_ALL: sv_SE.UTF-8

  aot-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Publish with Native AOT
        run: dotnet publish tests/MethodCache.AotSmokeTest --configuration Release --runtime linux-x64 --output ./aot-smoke

      - name: Run the AOT executable
        run: ./aot-smoke/MethodCache.AotSmokeTest

  package-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Pack the MethodCache package
        run: dotnet pack src/MethodCache.Core --configuration Release --output ./artifacts/packages

      - name: Check the generator, analyzers and code fixes are in the package
        run: |
          contents=$(unzip -l ./artifacts/packages/MethodCache.*.nupkg)
          for dll in analyzers/dotnet/cs/MethodCache.SourceGenerator.dll analyzers/dotnet/cs/MethodCache.Analyzers.dll analyzers/dotnet/cs/MethodCache.CodeFixes.dll; do
            echo "$contents" | grep -q "$dll" || { echo "Missing $dll"; exit 1; }
          done

      - name: Install the package and run the Quick Start
        run: dotnet run --project tests/MethodCache.PackageSmokeTest --configuration Release

      - name: Run the Quick Start again with the .NET 8 SDK (the oldest compiler the generator supports)
        working-directory: tests/MethodCache.PackageSmokeTest
        run: |
          rm -rf bin obj
          echo '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }' > global.json
          dotnet --version
          dotnet run --configuration Release

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the code in the docs matches tests/MethodCache.Docs.Tests
        run: |
          dotnet tool restore
          dotnet mdsnippets
          git diff --exit-code || { echo "::error::Docs are out of date. Run 'dotnet tool restore && dotnet mdsnippets' and commit the result."; exit 1; }
